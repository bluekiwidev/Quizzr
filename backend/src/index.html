<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Website</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#0f766e,#4f46e5);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    text-align:center;
    z-index:2;
    animation:fadeUp 1.2s ease;
}

h1{
    font-size:4rem;
    margin-bottom:20px;
}

p{
    font-size:1.2rem;
    opacity:.9;
    margin-bottom:35px;
}

button{
    padding:15px 40px;
    font-size:1rem;
    border:none;
    border-radius:50px;
    cursor:pointer;
    color:white;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(10px);
    transition:.3s;
}

button:hover{
    transform:translateY(-5px) scale(1.05);
    background:white;
    color:#111;
    box-shadow:0 15px 35px rgba(255,255,255,.3);
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Floating blobs */

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(20px);
    opacity:.45;
    animation:float 12s ease-in-out infinite;
}

.blob:nth-child(1){
    width:220px;
    height:220px;
    background:#00d4ff;
    left:10%;
    top:20%;
}

.blob:nth-child(2){
    width:320px;
    height:320px;
    background:#ff00aa;
    right:8%;
    bottom:10%;
    animation-duration:18s;
}

.blob:nth-child(3){
    width:180px;
    height:180px;
    background:#00ff88;
    right:30%;
    top:5%;
    animation-duration:15s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px) translateX(0px);
    }
    25%{
        transform:translateY(-40px) translateX(20px);
    }
    50%{
        transform:translateY(30px) translateX(-20px);
    }
    75%{
        transform:translateY(-20px) translateX(35px);
    }
}

/* Tiny sparkles */

.sparkle{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    animation:twinkle 4s linear infinite;
}

@keyframes twinkle{
    0%,100%{
        opacity:.1;
        transform:scale(.5);
    }
    50%{
        opacity:1;
        transform:scale(2);
    }
}
</style>
</head>

<body>

<div class="blob"></div>
<div class="blob"></div>
<div class="blob"></div>

<div class="container">
    <h1>Welcome</h1>
    <p>A simple animated homepage.</p>
    <button onclick="alert('Hello!')">Get Started</button>
</div>

<script>
// Generate sparkles
for(let i=0;i<70;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDelay=Math.random()*4+"s";
    s.style.animationDuration=(2+Math.random()*4)+"s";
    document.body.appendChild(s);
}

// Mouse glow
const glow=document.createElement("div");
glow.style.position="absolute";
glow.style.width="250px";
glow.style.height="250px";
glow.style.borderRadius="50%";
glow.style.pointerEvents="none";
glow.style.background="radial-gradient(circle, rgba(255,255,255,.15), transparent 70%)";
glow.style.transform="translate(-50%,-50%)";
document.body.appendChild(glow);

document.addEventListener("mousemove",(e)=>{
    glow.style.left=e.clientX+"px";
    glow.style.top=e.clientY+"px";
});
</script>

</body>
</html>
