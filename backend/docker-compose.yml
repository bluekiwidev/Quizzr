services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxlet-backend
    environment:
      DB_NAME: VoxletDB
      DB_USER: admin
      DB_PWORD: 1234
      DB_IP: mariadb
      DB_PORT: 3306
      BACKEND_API_PORT: 3000
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_started
  
  mariadb:
    image: mariadb:lts-ubi
    container_name: voxlet-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: 1234
      MARIADB_DATABASE: VoxletDB
      MARIADB_USER: admin
      MARIADB_PASSWORD: 1234
    ports:
      - "3306:3306"