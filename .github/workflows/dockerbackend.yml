name: Build backend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Docker Setup Docker
      uses: docker/setup-docker-action@v5.4.0

    - name: Build docker imae
      working-directory: backend
      run: docker build .
